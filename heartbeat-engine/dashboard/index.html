<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="initial-scale=1, viewport-fit=cover, width=device-width" />
    <title>Bloomie — BLOOM AI Employee</title>

    <!-- PWA -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1a1a1a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Bloomie" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      /* Keep horizontal and home-indicator safe areas here. The iOS status bar
         uses its own non-translucent area so it cannot cover the app header. */
      html {
        background-color: #1a1a1a;
        min-height: 100%;
        padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      /* In standalone PWA mode — body padding must be 0 */
      @media (display-mode: standalone) {
        body {
          padding: 0;
        }
      }

      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: #1a1a1a;
        line-height: 1.5;
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        min-height: 100vh;
        overscroll-behavior-y: none;
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      #root {
        min-height: 100vh;
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
      }

      /* iOS zooms the entire page when a focused form control is below 16px.
         Keep mobile controls at the native-safe size so the dashboard does not
         remain magnified after composing a message or using search/settings. */
      @media (max-width: 768px) {
        html,
        body,
        #root {
          width: 100%;
          height: 100dvh;
          min-height: 0;
          overflow: hidden;
        }

        body {
          position: fixed;
          inset: 0;
          overscroll-behavior: none;
        }

        input,
        textarea,
        select {
          font-size: 16px !important;
        }
      }
    </style>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script async defer src="https://js.whop.com/static/checkout/loader.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
